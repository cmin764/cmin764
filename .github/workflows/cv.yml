name: Build CV PDF

on:
  push:
    branches: [main]
    paths: [cv.md, cv-footer.tex]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build PDF
        uses: docker://pandoc/extra:latest
        with:
          args: cv.md -o cv.pdf --pdf-engine=xelatex -V geometry:margin=2cm -V title-meta="Cosmin Poieana - CV" -V author-meta="Cosmin Poieana" -V colorlinks -V urlcolor=blue -V lang=en -H cv-footer.tex

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cv
          path: cv.pdf

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
